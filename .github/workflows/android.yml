# .github/workflows/android.yml

name: Android Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/native/engine/android/**'
      - 'src/native/framework/**'
      - 'src/native/core/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/native/engine/android/**'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install shards
        run: shards install

      - name: Build Android engine
        working-directory: src/native/engine/android
        run: |
          make NDK_PATH=$ANDROID_NDK

      - name: Upload engine library
        uses: actions/upload-artifact@v4
        with:
          name: libnative_cr_engine
          path: src/native/engine/android/libnative_cr_engine.so

      - name: Create Crystal wrapper script
        run: |
          cat > crystal-android-wrapper << 'EOF'
          #!/bin/bash
          export CRYSTAL_LIBRARY_PATH="$ANDROID_NDK/sysroot/usr/lib/aarch64-linux-android/24"
          
          raw_command=$(crystal build "$@" --verbose 2>&1 >/dev/null | grep "cc " | tail -n1)
          
          if [ -z "$raw_command" ]; then
              echo "Error: Could not find linker command from --verbose output"
              exit 1
          fi
          
          filtered_command=$(echo "$raw_command" | sed 's|/system/lib64/libdl.so||g' | sed 's|-ldl||g')
          
          echo "Running filtered linker command:"
          echo "$filtered_command"
          eval "$filtered_command"
          EOF
          chmod +x crystal-android-wrapper

      - name: Build Crystal library for Android
        run: |
          rm -rf .native_cache
          mkdir -p build/lib/arm64-v8a
          export NDK=$ANDROID_NDK
          export TARGET=aarch64-linux-android
          export API=24
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          
          ./crystal-android-wrapper build src/native.cr -D android --target $TARGET \
            --link-flags="-shared -fPIC" \
            -o build/lib/arm64-v8a/libnative_cr.so

      - name: Upload Crystal library
        uses: actions/upload-artifact@v4
        with:
          name: libnative_cr
          path: build/lib/arm64-v8a/libnative_cr.so
