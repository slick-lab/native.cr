# .github/workflows/android.yml

name: Android Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/native/engine/android/**'
      - 'src/native/framework/**'
      - 'src/native/core/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/native/engine/android/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install shards
        run: shards install

      - name: Build Android engine
        working-directory: src/native/engine/android
        run: |
          make NDK_PATH=$ANDROID_NDK

      - name: Upload engine library
        uses: actions/upload-artifact@v4
        with:
          name: libnative_cr_engine
          path: src/native/engine/android/libnative_cr_engine.so

      - name: Build Crystal library for Android
        run: |
          rm -rf .native_cache
          mkdir -p build/lib/arm64-v8a
          export NDK=$ANDROID_NDK
          export TARGET=aarch64-linux-android
          export API=24
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          
          # Step 1: Compile to object files
          crystal build src/native.cr -D android --target $TARGET -c
          
          # Step 2: Link with NDK linker
          $CC -shared -fPIC \
            -o build/lib/arm64-v8a/libnative_cr.so \
            $(find . -name "*.o" -path "./.native_cache/*" 2>/dev/null) \
            -L$TOOLCHAIN/sysroot/usr/lib/$TARGET/$API -lc -lm

      - name: Upload Crystal library
        uses: actions/upload-artifact@v4
        with:
          name: libnative_cr
          path: build/lib/arm64-v8a/libnative_cr.so
