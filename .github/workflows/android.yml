# .github/workflows/android.yml

name: Android Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/native/engine/android/**'
      - 'src/native/framework/**'
      - 'src/native/core/**'
      - 'src/native.cr'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build autoconf automake libtool

      - name: Install shards
        run: shards install

      - name: Build Android engine
        working-directory: src/native/engine/android
        run: |
          make NDK_PATH=$ANDROID_NDK

      - name: Upload engine library
        uses: actions/upload-artifact@v4
        with:
          name: libnative_cr_engine
          path: src/native/engine/android/libnative_cr_engine.so

      - name: Build PCRE2 for Android
        run: |
          export NDK=$ANDROID_NDK
          export TARGET=aarch64-linux-android
          export API=24
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          
          wget -q https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.42/pcre2-10.42.tar.gz
          tar -xzf pcre2-10.42.tar.gz
          cd pcre2-10.42
          ./configure --host=aarch64-linux-android --prefix=$(pwd)/install --disable-shared --enable-static
          make -j4
          make install
          cd ..

      - name: Build Crystal library for Android
        run: |
          rm -rf .native_cache
          mkdir -p build/lib/arm64-v8a
          
          export NDK=$ANDROID_NDK
          export TARGET=aarch64-linux-android
          export API=24
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          
          sudo mkdir -p /system/lib64
          sudo touch /system/lib64/libdl.so
          
          export CRYSTAL_LIBRARY_PATH=$(pwd)/pcre2-10.42/install/lib:$TOOLCHAIN/sysroot/usr/lib/$TARGET/$API
          
          crystal build src/native.cr -D android --target $TARGET \
            --link-flags="-shared -fPIC" \
            -o build/lib/arm64-v8a/libnative_cr.so

      - name: Upload Crystal library
        uses: actions/upload-artifact@v4
        with:
          name: libnative_cr
          path: build/lib/arm64-v8a/libnative_cr.so
