# .github/workflows/ios.yml

name: iOS Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/native/engine/ios/**'
      - 'src/native/framework/**'
      - 'src/native/core/**'
      - 'src/native.cr'
  pull_request:
    branches: [main]
    paths:
      - 'src/native/engine/ios/**'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.0

      - name: Install shards
        run: shards install

      - name: Build iOS engine
        run: |
          cd src/native/engine/ios
          make
          ls -la *.a
          ls -la *.metallib
          cd ../../..

      - name: Build Crystal framework for iOS
        run: |
          mkdir -p build
          crystal build src/native.cr -D ios --target aarch64-apple-ios \
            --link-flags="-static -L$(pwd)/src/native/engine/ios -lnative_cr_engine" \
            -o build/NativeCr

      - name: Create framework structure
        run: |
          mkdir -p build/NativeCr.framework/Headers
          cp build/NativeCr build/NativeCr.framework/
          cp src/native/engine/ios/default.metallib build/NativeCr.framework/ 2>/dev/null || true
          cat > build/NativeCr.framework/module.modulemap << 'EOF'
          framework module NativeCr {
            export *
            module * { export * }
          }
          EOF

      - name: Upload iOS framework
        uses: actions/upload-artifact@v4
        with:
          name: NativeCr.framework
          path: build/NativeCr.framework
