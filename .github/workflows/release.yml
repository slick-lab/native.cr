name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: x86_64-linux-gnu
            artifact-name: native.cr-linux-x86_64
            os-label: linux-x86-64
          - runs-on: ubuntu-24.04-arm
            target: aarch64-linux-gnu
            artifact-name: native.cr-linux-arm64
            os-label: linux-arm64
          - runs-on: macos-15
            target: aarch64-apple-darwin
            artifact-name: native.cr-darwin-arm64
            os-label: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Shards
        run: shards install

      # ubuntu-26.04's libcrypto.a pulls zstd + jitter-entropy; the static
      # link on the x86-64 leg needs both archives (same story as the
      # Build CLI for x86-64 workflow). ARM64/macOS legs are unaffected.
      - name: Install static-link deps (x86-64 leg only)
        if: matrix.target == 'x86_64-linux-gnu'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libzstd-dev zlib1g-dev
          sudo apt-get install -y -q libjitterentropy-dev || {
            git clone --depth 1 https://github.com/smuellerDD/jitterentropy-library /tmp/jitter
            make -C /tmp/jitter
            JIT_A=$(find /tmp/jitter -name '*.a' | head -1)
            sudo cp "$JIT_A" /usr/local/lib/libjitterentropy.a
          }

      - name: Build CLI (Release)
        run: |
          # x86-64 leg: wrap cc so -lzstd/-ljitterentropy land AFTER
          # libcrypto.a (Crystal places user flags before pkg-config libs;
          # static archives are order-sensitive).
          if [ "${{ matrix.target }}" = "x86_64-linux-gnu" ]; then
            printf '#!/bin/sh\nexec /usr/bin/cc "$@" -lzstd -L/usr/local/lib -ljitterentropy\n' > ccwrap
            chmod +x ccwrap
            export CC="$PWD/ccwrap"
          fi
          crystal build src/native.cr -o native.cr --release --static --target ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: native.cr

  create-release:
    needs: build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # Asset names MUST match scripts/postinstall.sh's download URLs
      # (native.cr-${OS}-${ARCH} with OS=linux/darwin, ARCH=x86_64/arm64).
      # CHECKSUMS is generated here and verified by postinstall — any
      # binary that reaches a user has a published sha256 to check
      # against.
      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          for name in native-cli-linux-x86-64 native-cli-linux-arm64 native-cli-darwin-arm64; do
            if [ -f "artifacts/$name/native.cr" ]; then
              cp "artifacts/$name/native.cr" "release-assets/$name"
              chmod +x "release-assets/$name"
            fi
          done

          # Normalize to the postinstall naming scheme.
          mv "release-assets/native-cli-linux-x86-64"  "release-assets/native.cr-linux-x86_64"  2>/dev/null || true
          mv "release-assets/native-cli-linux-arm64"   "release-assets/native.cr-linux-arm64"   2>/dev/null || true
          mv "release-assets/native-cli-darwin-arm64"  "release-assets/native.cr-darwin-arm64"  2>/dev/null || true

          cd release-assets
          sha256sum native.cr-* > CHECKSUMS

          ls -la .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
