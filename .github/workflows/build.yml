# .github/workflows/build.yml

name: Build Android Engine

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download AndroidX dependencies
        run: |
          cd src/native/engine/android
          mkdir -p libs
          cd libs
          wget -q https://repo1.maven.org/maven2/androidx/recyclerview/recyclerview/1.3.2/recyclerview-1.3.2.jar
          wget -q https://repo1.maven.org/maven2/androidx/cardview/cardview/1.0.0/cardview-1.0.0.jar
          wget -q https://repo1.maven.org/maven2/androidx/biometric/biometric/1.1.0/biometric-1.1.0.jar
          wget -q https://repo1.maven.org/maven2/androidx/appcompat/appcompat/1.6.1/appcompat-1.6.1.jar
          wget -q https://repo1.maven.org/maven2/androidx/core/core/1.12.0/core-1.12.0.jar
          wget -q https://repo1.maven.org/maven2/com/google/android/material/material/1.11.0/material-1.11.0.jar

      - name: Build Android engine
        run: |
          cd src/native/engine/android
          make NDK_PATH=$ANDROID_NDK SDK_PATH=$ANDROID_HOME

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-engine
          path: |
            src/native/engine/android/libnative_cr_engine.so
            src/native/engine/android/libnative_cr_android.jar
