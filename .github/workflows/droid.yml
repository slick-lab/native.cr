name: Android Termux Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Termux APK
        run: |
          wget https://github.com/termux/termux-app/releases/download/v0.118.0/termux-app_v0.118.0+github-debug_arm64-v8a.apk -O termux.apk

      - name: Run Android Emulator with Termux
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: Pixel 4
          script: |
            adb install termux.apk
            adb shell am start -n com.termux/.app.TermuxActivity
            sleep 5

            adb shell "input text 'pkg update -y && pkg upgrade -y' && input keyevent KEYCODE_ENTER"
            sleep 15
            adb shell "input text 'pkg install -y crystal git make clang openssl' && input keyevent KEYCODE_ENTER"
            sleep 45

            adb shell "input text 'cd /sdcard && git clone https://github.com/slick-lab/native.cr.git' && input keyevent KEYCODE_ENTER"
            sleep 10
            adb shell "input text 'cd native.cr && shards install' && input keyevent KEYCODE_ENTER"
            sleep 20
            adb shell "input text 'crystal build src/native.cr -o native.cr' && input keyevent KEYCODE_ENTER"
            sleep 30

            adb pull /sdcard/native.cr/native.cr ./native.cr
            adb pull /sdcard/native.cr/src/native/engine/android/libnative_cr_engine.so ./ 2>/dev/null || true
            adb pull /sdcard/native.cr/build/lib/arm64-v8a/libnative_cr.so ./ 2>/dev/null || true

      - name: Package artifacts
        run: |
          mkdir -p release
          [ -f native.cr ] && cp native.cr release/ || true
          [ -f libnative_cr_engine.so ] && cp libnative_cr_engine.so release/ || true
          [ -f libnative_cr.so ] && cp libnative_cr.so release/ || true
          cd release
          tar -czf ../native.cr-android.tar.gz * || echo "No artifacts to package"
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: native.cr-android.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
