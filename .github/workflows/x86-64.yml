name: Build CLI for x86-64

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Shards
        run: shards install

      # ubuntu-latest's libcrypto.a is built with zstd support; the static
      # link needs its archive present or ZSTD_* symbols stay undefined.
      - name: Install static-link deps
        run: sudo apt-get update -q && sudo apt-get install -y -q libzstd-dev zlib1g-dev

      - name: Build CLI (Release)
        run: |
          # Crystal puts user link flags BEFORE pkg-config libs on the cc
          # command line, so a plain --link-flags="-lzstd" lands ahead of
          # libcrypto.a and resolves nothing (archives are order-sensitive).
          # Wrap the compiler driver so -lzstd is the LAST argument.
          printf '#!/bin/sh\nexec /usr/bin/cc "$@" -lzstd\n' > ccwrap
          chmod +x ccwrap
          export CC="$PWD/ccwrap"
          crystal build src/native.cr -o native.cr --release --static --target x86_64-linux-gnu

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-linux-x86-64
          path: native.cr
