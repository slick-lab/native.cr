# hwaro.yml
title: native.cr Documentation
description: Build native mobile apps with Crystal
base_url: https://docs.native.cr

source: docs
output: public

theme: default

markdown:
  options:
    - smart
    - tables
    - fenced_code_blocks

templates:
  layout: _layouts/default.html
  partials: _partials

assets:
  - docs/assets/css
  - docs/assets/js
  - docs/assets/images

hooks:
  pre_build:
    - crystal scripts/generate_api_docs.cr
  post_build: []

server:
  port: 3000
  live_reload: true
  watch:
    - docs
    - _layouts
    - _partials
