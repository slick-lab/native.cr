<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#0d0d0d"/>
  <g stroke="#6f5ce6" stroke-width="4" fill="none">
    <ellipse cx="100" cy="100" rx="60" ry="25" transform="rotate(0 100 100)"/>
    <ellipse cx="100" cy="100" rx="60" ry="25" transform="rotate(60 100 100)"/>
    <ellipse cx="100" cy="100" rx="60" ry="25" transform="rotate(120 100 100)"/>
  </g>
  <polygon points="100,60 120,100 100,140 80,100" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a4fff"/>
      <stop offset="100%" stop-color="#4fc3ff"/>
    </linearGradient>
  </defs>
</svg>
