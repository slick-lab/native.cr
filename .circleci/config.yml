version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2204:2023.07.2
    steps:
      - checkout

      - run:
          name: Install Android SDK & NDK
          command: |
            sudo apt-get update
            sudo apt-get install -y wget unzip
            wget https://dl.google.com/android/repository/commandlinetools-linux-latest.zip
            unzip commandlinetools-linux-latest.zip -d $HOME/android-sdk
            echo 'export ANDROID_HOME=$HOME/android-sdk' >> $BASH_ENV
            echo 'export PATH=$PATH:$ANDROID_HOME/cmdline-tools/bin' >> $BASH_ENV
            source $BASH_ENV
            yes | sdkmanager --licenses
            sdkmanager "ndk;25.2.9519653"

      - run:
          name: Install Crystal
          command: |
            curl -fsSL https://crystal-lang.org/install.sh | sudo bash

      - run:
          name: Build Android Engine
          command: |
            cd src/native/engine/android
            make NDK_PATH=$ANDROID_HOME/ndk/25.2.9519653

      - run:
          name: Build Crystal Library
          command: |
            export NDK=$ANDROID_HOME/ndk/25.2.9519653
            export TARGET=aarch64-linux-android
            export API=24
            export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
            export CC=$TOOLCHAIN/bin/$TARGET$API-clang
            
            sudo mkdir -p /system/lib64
            sudo touch /system/lib64/libdl.so
            
            mkdir -p build/lib/arm64-v8a
            
            crystal build src/native.cr -D android --target $TARGET \
              --link-flags="-shared -fPIC" \
              -o build/lib/arm64-v8a/libnative_cr.so

workflows:
  version: 2
  build:
    jobs:
      - build
