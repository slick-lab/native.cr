version: 2.1

jobs:
  build:
    machine:
      image: android:2024.11.1
    steps:
      - checkout

      - run:
          name: Install Android NDK
          command: |
            yes | sdkmanager --licenses || true
            sdkmanager "ndk;25.2.9519653"

      - run:
          name: Install Crystal
          command: |
            curl -fsSL https://crystal-lang.org/install.sh | sudo bash

      - run:
          name: Build Android Engine
          command: |
            cd src/native/engine/android
            make NDK_PATH=$ANDROID_HOME/ndk/25.2.9519653

      - run:
          name: Build PCRE2 for Android arm64
          command: |
            export NDK=$ANDROID_HOME/ndk/25.2.9519653
            export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64

            wget -q https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.42/pcre2-10.42.tar.gz
            tar xzf pcre2-10.42.tar.gz
            cd pcre2-10.42

            ./configure \
              --host=aarch64-linux-android \
              --prefix=/tmp/pcre2-android \
              --enable-static \
              --disable-shared \
              --disable-jit \
              CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang" \
              CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++" \
              AR="$TOOLCHAIN/bin/llvm-ar" \
              RANLIB="$TOOLCHAIN/bin/llvm-ranlib"

            make -j$(nproc)
            make install

      - run:
          name: Build GC stub for Android arm64
          command: |
            export NDK=$ANDROID_HOME/ndk/25.2.9519653
            export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64

            mkdir -p /tmp/gc-android-arm64

            cat > /tmp/gc_stub.c << 'EOF'
            #include <stdlib.h>
            #include <stddef.h>
            typedef void (*GC_finalization_proc)(void *, void *);
            typedef int GC_bool;
            void GC_init(void) {}
            void *GC_malloc(size_t size) { return malloc(size); }
            void *GC_malloc_atomic(size_t size) { return malloc(size); }
            void *GC_malloc_uncollectable(size_t size) { return malloc(size); }
            void GC_free(void *ptr) { free(ptr); }
            void *GC_realloc(void *ptr, size_t size) { return realloc(ptr, size); }
            void GC_gcollect(void) {}
            void GC_enable(void) {}
            void GC_disable(void) {}
            GC_bool GC_is_disabled(void) { return 0; }
            void *GC_base(void *ptr) { return NULL; }
            void GC_register_finalizer_no_order(void *obj, GC_finalization_proc fn, void *cd, GC_finalization_proc *ofn, void **ocd) {}
            int GC_register_disappearing_link(void **link) { return 0; }
            int GC_unregister_disappearing_link(void **link) { return 0; }
            size_t GC_get_heap_size(void) { return 0; }
            size_t GC_get_free_bytes(void) { return 0; }
            size_t GC_get_unmapped_bytes(void) { return 0; }
            size_t GC_get_bytes_since_gc(void) { return 0; }
            size_t GC_get_total_bytes(void) { return 0; }
            void GC_set_max_heap_size(size_t n) {}
            int GC_invoke_finalizers(void) { return 0; }
            void GC_atfork_prepare(void) {}
            void GC_atfork_parent(void) {}
            void GC_atfork_child(void) {}
            EOF

            $TOOLCHAIN/bin/aarch64-linux-android24-clang \
              -c /tmp/gc_stub.c \
              -o /tmp/gc-android-arm64/gc_stub.o

            $TOOLCHAIN/bin/llvm-ar rcs /tmp/gc-android-arm64/libgc.a \
              /tmp/gc-android-arm64/gc_stub.o

      - run:
          name: Build Crystal Library
          command: |
            export NDK=$ANDROID_HOME/ndk/25.2.9519653
            export TARGET=aarch64-linux-android
            export API=24
            export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
            export CC=$TOOLCHAIN/bin/$TARGET$API-clang

            sudo mkdir -p /system/lib64
            sudo touch /system/lib64/libdl.so

            mkdir -p build/lib/arm64-v8a

            crystal build src/native.cr -D android -D without_gc --target $TARGET \
              --link-flags="-shared -fPIC -L/tmp/gc-android-arm64 -L/tmp/pcre2-android/lib" \
              -o build/lib/arm64-v8a/libnative_cr.so

workflows:
  version: 2
  build:
    jobs:
      - build
