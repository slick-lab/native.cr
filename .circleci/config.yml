version: 2.1

jobs:
  build-android:
    machine:
      image: android:2024.11.1
    steps:
      - checkout

      - run:
          name: Download Termux APK
          command: |
            wget https://github.com/termux/termux-app/releases/download/v0.118.0/termux-app_v0.118.0+github-debug_arm64-v8a.apk -O termux.apk

      - run:
          name: Start Emulator and Build
          command: |
            # Start emulator with KVM acceleration
            echo "y" | sdkmanager "system-images;android-30;google_apis;arm64-v8a"
            echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;arm64-v8a" --force
            $ANDROID_HOME/emulator/emulator -avd test -no-audio -no-window -no-snapshot -gpu swiftshader_indicator &
            
            # Wait for boot
            adb wait-for-device
            while [ "$(adb shell getprop sys.boot_completed)" != "1" ]; do sleep 5; done
            
            adb install termux.apk
            adb shell am start -n com.termux/.app.TermuxActivity
            sleep 5

            adb shell "input text 'pkg update -y && pkg upgrade -y' && input keyevent KEYCODE_ENTER"
            sleep 15
            adb shell "input text 'pkg install -y crystal git make clang openssl' && input keyevent KEYCODE_ENTER"
            sleep 45

            adb shell "input text 'cd /sdcard && git clone https://github.com/slick-lab/native.cr.git' && input keyevent KEYCODE_ENTER"
            sleep 10
            adb shell "input text 'cd native.cr && shards install' && input keyevent KEYCODE_ENTER"
            sleep 20
            adb shell "input text 'crystal build src/native.cr -o native.cr' && input keyevent KEYCODE_ENTER"
            sleep 30

            mkdir -p /tmp/artifacts
            adb pull /sdcard/native.cr/native.cr /tmp/artifacts/
            adb pull /sdcard/native.cr/src/native/engine/android/libnative_cr_engine.so /tmp/artifacts/ 2>/dev/null || true
            adb pull /sdcard/native.cr/build/lib/arm64-v8a/libnative_cr.so /tmp/artifacts/ 2>/dev/null || true

      - persist_to_workspace:
          root: /tmp/artifacts
          paths:
            - native.cr
            - libnative_cr_engine.so
            - libnative_cr.so

  release:
    machine:
      image: ubuntu-2204:2023.07.2
    steps:
      - attach_workspace:
          at: /tmp/artifacts
      - run:
          name: Package artifacts
          command: |
            mkdir -p release
            cp /tmp/artifacts/* release/ 2>/dev/null || true
            cd release
            tar -czf ../native.cr-android.tar.gz * || echo "No artifacts to package"
            cd ..
      - run:
          name: Create GitHub Release
          command: |
            if [ -n "$CIRCLE_TAG" ]; then
              curl -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"tag_name\":\"$CIRCLE_TAG\",\"name\":\"Release $CIRCLE_TAG\",\"draft\":false,\"prerelease\":false}" \
                https://api.github.com/repos/slick-lab/native.cr/releases
            fi
      - store_artifacts:
          path: native.cr-android.tar.gz
          destination: release

workflows:
  version: 2
  build-and-release:
    jobs:
      - build-android:
          filters:
            tags:
              only: /^v.*/
      - release:
          requires:
            - build-android
          filters:
            tags:
              only: /^v.*/
