# hwaro.yml
base_url = "https://slick-lab.github.io/native.cr"
title = "Native.cr"
description = "React Native for Crystal developers. Build native mobile apps with Crystal."
theme = "default"

source = "docs"
output = "public"
static = "static"

[taxonomies]
  tag = "tags"
  category = "categories"

[search]
enabled = true

[sitemap]
enabled = true

[llms]
enabled = true

[markdown]
highlight = true
hightlight_style = "github"
table_of_contents = true

[markdown.extensions]
  fenced_code_blocks = true
  autolink = true
  strikethrough = true
  tables = true
  task_lists = true